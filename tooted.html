<!--Nordicbites-->

<!doctype html>
<html lang="et">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="NordicBites – värsked käsitööleivad, saiakesed ja kohv Tartus.">
    <title>NordicBites Tooted</title>

     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
    
    <!-- Bootstrap Icons: -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" 
    rel="stylesheet">

    <!-- Meie enda CSS, lisada peale bootstrap stylesheet-i (override) -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- PÄIS -->
    <header class="site-header">
        <div class="container header-row">

            <!-- Logo -->
            <a href="index.html" class="brand">
                <img src="images/logo.png" class="brand-icon" alt="">
                NordicBites
            </a>

            <!-- Peamenüü -->
            <nav class="nav" id="main-nav">
                <a href="index.html">Avaleht</a>
                <a href="tooted.html" class ="active">Tooted</a>
                <a href="meist.html">Meist</a>
                <a href="index.html#kontakt">Kontakt</a> <!--viib esilehe jalusesse-->
            </nav>

            <!-- Otsing, ostukorv ja mobiilimenüü (hamburger) -->
            <div class="header-actions">
                <!-- Otsingunupp: -->
                <button class="icon-button" id="search-toggle" type="button">
                    <i class="bi bi-search"></i>
                </button>

                <!-- Ostukorv: -->
                <a href="checkout.html" class="carticon">
                    <i class="bi bi-bag"></i>
                    <span>(<span data-cart-count>0</span>)</span>
                </a>

                <!-- Hamburgerimenüü: -->
                <button type="button" class="menu-button" id="menu-toggle">
                    <i class="bi bi-list"></i>
                </button>
            </div>
        </div>
                <!-- Otsinguväli -->
        <div class="container search-bar" id="search-bar">
            <input id="product-search" type="search"
                placeholder="Otsi tooteid nime järgi (tootekataloogist)">
        </div>
    </header>


    <main class="container catalog">
        <!-- Tootekategooriate filtrid:-->
        <div class="filters">
            <button type="button" class="filter-button selected"data-category="all">
                Kõik tooted</button>
            <button type="button" class="filter-button" data-category="saiakesed">
                Saiakesed ja Koogid</button>
            <button type="button" class="filter-button"data-category="leivad">
                Käsitööleivad</button>
            <button type="button" class="filter-button" data-category="joogid">
                Kuumad Joogid</button>
        </div>

        <!--JS lisab tootekataloogi tooted:-->
        <div class="product-grid" id="catalog-grid"></div>
    </main>


    <!--alumine roheline ostukorviriba, ilmub kui toode on ostukorvis-->
    <div class="cart-strip" hidden>
        <div class="container">
            <span data-cart-summary>Ostukorvis on 0 toodet</span>
            <a href="checkout.html">Mine maksma→</a>
        </div>
    </div>

 

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Meie JavaScript -->
    <script src="js/script.js" defer></script>

</body>
</html>
